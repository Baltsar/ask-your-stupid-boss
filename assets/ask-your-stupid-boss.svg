<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title id="title">Ask your stupid boss</title>
  <desc id="desc">Left: in Claude Code a small model doing the work asks a bigger advisor, Opus or Fable. Right: the uno reverse. In this repo the big model, Opus 5.5, does the work and asks a tiny Haiku 5.5 wearing a tie. Claude Code stamps it: cannot advise claude-opus-5-5. Opus rejects the advice.</desc>
  <rect width="1280" height="640" fill="#f3efe4"/>
  <rect x="16" y="16" width="1248" height="608" fill="none" stroke="#1c1915" stroke-width="3"/>
  <text x="48" y="74" fill="#1c1915" font-size="42" font-weight="700">ASK YOUR STUPID BOSS</text>
  <text x="48" y="106" fill="#5c564c" font-size="20">Claude Code: the advisor must be at least as capable as the model doing the work.</text>
  <rect x="48" y="128" width="420" height="438" fill="none" stroke="#1c1915" stroke-width="3"/>
  <text x="68" y="160" fill="#1c1915" font-size="16" font-weight="700" letter-spacing="1">CLAUDE CODE /advisor</text>
  <g transform="translate(76 186)">
  <path d="M18 0 L126 0 L126 36 L144 36 L144 54 L126 54 L126 72 L117 72 L117 90 L108 90 L108 72 L99 72 L99 90 L90 90 L90 72 L54 72 L54 90 L45 90 L45 72 L36 72 L36 90 L27 90 L27 72 L18 72 L18 54 L0 54 L0 36 L18 36 Z M36 18 L45 18 L45 36 L36 36 Z M99 18 L108 18 L108 36 L99 36 Z" fill="#d97757" fill-rule="evenodd"/>
  </g>
  <text x="248" y="206" fill="#5c564c" font-size="16" letter-spacing="1">ADVISOR</text>
  <text x="248" y="236" fill="#1c1915" font-size="23" font-weight="700">Opus or Fable</text>
  <text x="248" y="263" fill="#1c1915" font-size="17">reads everything</text>
  <line x1="148" y1="378" x2="148" y2="302" stroke="#1c1915" stroke-width="3"/>
  <polygon points="148,290 139,306 157,306" fill="#1c1915"/>
  <text x="168" y="342" fill="#1c1915" font-size="17">asks up</text>
  <g transform="translate(108 392)">
  <path d="M10 0 L70 0 L70 20 L80 20 L80 30 L70 30 L70 40 L65 40 L65 50 L60 50 L60 40 L55 40 L55 50 L50 50 L50 40 L30 40 L30 50 L25 50 L25 40 L20 40 L20 50 L15 50 L15 40 L10 40 L10 30 L0 30 L0 20 L10 20 Z M20 10 L25 10 L25 20 L20 20 Z M55 10 L60 10 L60 20 L55 20 Z" fill="#d97757" fill-rule="evenodd"/>
  </g>
  <text x="248" y="404" fill="#5c564c" font-size="16" letter-spacing="1">MAIN</text>
  <text x="248" y="434" fill="#1c1915" font-size="23" font-weight="700">Sonnet</text>
  <text x="248" y="461" fill="#1c1915" font-size="17">does the work</text>
  <line x1="68" y1="496" x2="448" y2="496" stroke="#1c1915" stroke-width="1.5"/>
  <text x="68" y="526" fill="#1c1915" font-size="18" font-weight="700">Weaker asks stronger.</text>
  <text x="68" y="550" fill="#5c564c" font-size="17">Claude allows this.</text>
  <rect x="492" y="128" width="740" height="438" fill="none" stroke="#1c1915" stroke-width="3"/>
  <text x="512" y="160" fill="#1c1915" font-size="16" font-weight="700" letter-spacing="1">THIS REPO &#183; UNO REVERSE</text>
  <rect x="512" y="176" width="700" height="160" fill="#f6d56b" stroke="#1c1915" stroke-width="3"/>
  <g transform="translate(564 212)">
  <path d="M14 0 L98 0 L98 28 L112 28 L112 42 L98 42 L98 56 L91 56 L91 70 L84 70 L84 56 L77 56 L77 70 L70 70 L70 56 L42 56 L42 70 L35 70 L35 56 L28 56 L28 70 L21 70 L21 56 L14 56 L14 42 L0 42 L0 28 L14 28 Z M28 14 L35 14 L35 28 L28 28 Z M77 14 L84 14 L84 28 L77 28 Z" fill="#d97757" fill-rule="evenodd"/>
  <polygon points="49.7,30.099999999999998 62.3,30.099999999999998 59.85,37.1 52.15,37.1" fill="#1c1915"/>
  <polygon points="52.15,37.1 59.85,37.1 64.05,58.10000000000001 56,66.5 47.95,58.10000000000001" fill="#1c1915"/>
  </g>
  <text x="724" y="214" fill="#1c1915" font-size="16">ADVISOR &#183; no tools &#183; no files &#183; no veto</text>
  <text x="724" y="250" fill="#1c1915" font-size="30" font-weight="700">Haiku 5.5</text>
  <text x="724" y="276" fill="#1c1915" font-size="17">Director of Unnecessary Oversight</text>
  <text x="724" y="312" fill="#1c1915" font-size="18" font-weight="700">&#8220;The plan skips the change committee.&#8221;</text>
  <line x1="620" y1="376" x2="620" y2="350" stroke="#1c1915" stroke-width="3"/>
  <polygon points="620,338 611,354 629,354" fill="#1c1915"/>
  <text x="640" y="363" fill="#1c1915" font-size="17">asks anyway</text>
  <rect x="512" y="376" width="700" height="170" fill="#1c1915"/>
  <g transform="translate(532 406)">
  <path d="M22 0 L154 0 L154 44 L176 44 L176 66 L154 66 L154 88 L143 88 L143 110 L132 110 L132 88 L121 88 L121 110 L110 110 L110 88 L66 88 L66 110 L55 110 L55 88 L44 88 L44 110 L33 110 L33 88 L22 88 L22 66 L0 66 L0 44 L22 44 Z M44 22 L55 22 L55 44 L44 44 Z M121 22 L132 22 L132 44 L121 44 Z" fill="#d97757" fill-rule="evenodd"/>
  </g>
  <text x="724" y="412" fill="#f3efe4" font-size="16">MAIN &#183; does the work &#183; may say no</text>
  <text x="724" y="448" fill="#f6d56b" font-size="30" font-weight="700">Opus 5.5</text>
  <text x="724" y="474" fill="#f3efe4" font-size="17">Plan: delete an empty file.</text>
  <text x="724" y="510" fill="#f6d56b" font-size="18" font-weight="700">&#8220;Rejected. The file is empty.&#8221;</text>
  <g transform="rotate(-4 1030 146)">
  <rect x="836" y="117" width="388" height="58" fill="#f3efe4" stroke="#b3261e" stroke-width="3.5"/>
  <text x="1030" y="142" fill="#b3261e" font-size="19" font-weight="700" text-anchor="middle">cannot advise &quot;claude-opus-5-5&quot;</text>
  <text x="1030" y="163" fill="#b3261e" font-size="13" text-anchor="middle" letter-spacing="1">CLAUDE CODE 2.1.296, TO HAIKU 5.5</text>
  </g>
  <text x="48" y="598" fill="#5c564c" font-size="17">The boss can complain. The boss cannot open a file, run a command, or veto.</text>
  <text x="1232" y="598" fill="#5c564c" font-size="15" text-anchor="end">parody &#183; not affiliated with Anthropic</text>
</svg>
